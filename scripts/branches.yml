# Branch-publishing manifest for the NestJS workshop.
#
# Each entry maps a logical step name to the authoring commit pair that
# materialises its `start/<step>` and `solution/<step>` branches.
#
# Per research.md R1, A_x is BOTH solution/0x AND start/0(x+1) for the
# core sequence, so most entries reference the same commit twice.
#
# Stretch entries reference A8 as the start, and a unique authoring
# branch tip as the solution (one per stretch — they are not chained).
#
# Format:
#   - name: <step-slug>           # branch suffix after start/ and solution/
#     start: <git-rev>            # commit for `start/<name>`
#     solution: <git-rev>         # commit for `solution/<name>`
#
# Run `bash scripts/publish-branches.sh` to publish (idempotent).

# MVP delivery (Phases 1-3): two step pairs published.
# Per research.md R1, every Ax commit is BOTH solution/0x AND
# start/0(x+1) for the core sequence. start/01 is the foundational
# tip (be2b707) — that is, A0 plus the cross-cutting Phase 2
# additions, which are workshop infrastructure that must be present
# from step 01 onward.

branches:
